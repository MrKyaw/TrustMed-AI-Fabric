[build-system]
requires = ["setuptools>=74"]
build-backend = "setuptools.build_meta"

[project]
name = "trustmed-ai-fabric"
version = "1.0.0"
description = "Governed, traceable AI fabric for regulated life-sciences content, experiences and measurement."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MrKyaw" }]
keywords = [
  "ai-governance",
  "content-supply-chain",
  "life-sciences",
  "mcp",
  "traceability",
  "rag",
  "evaluation",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "jsonschema>=4.23",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "pyyaml>=6.0",
  "ruff>=0.7",
]

[project.scripts]
trustmed = "trustmed_fabric.cli:main"
trustmed-mcp = "trustmed_fabric.mcp_server:main"

[project.urls]
Homepage = "https://github.com/MrKyaw/TrustMed-AI-Fabric"
Documentation = "https://github.com/MrKyaw/TrustMed-AI-Fabric/tree/main/docs"
Issues = "https://github.com/MrKyaw/TrustMed-AI-Fabric/issues"
Changelog = "https://github.com/MrKyaw/TrustMed-AI-Fabric/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trustmed_fabric = ["data/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "contract: machine-readable contract and schema tests",
  "e2e: cross-process or full-stack end-to-end tests",
  "property: property-based tests",
  "security: abuse, tamper and boundary tests",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["trustmed_fabric"]
branch = true
omit = ["src/trustmed_fabric/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 88
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["src/trustmed_fabric/web"]
