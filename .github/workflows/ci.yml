name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: PYTHONPATH=src ruff check src tests
      - name: Type check
        run: PYTHONPATH=src mypy src
      - name: Tests
        run: PYTHONPATH=src pytest --cov=trustmed_fabric --cov-fail-under=88
      - name: Evaluation
        run: PYTHONPATH=src trustmed eval --no-write
